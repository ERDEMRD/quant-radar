name: Mail Quant Radar digest

# digests/ klasörüne yeni digest push edildiğinde tetiklenir
on:
  push:
    paths:
      - 'digests/**'

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: En son digest'i bul ve mail at
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}       # Gmail adresin
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }} # Gmail uygulama şifresi
          MAIL_TO: ${{ secrets.MAIL_TO }}                   # alıcı (boşsa MAIL_USERNAME)
        run: |
          LATEST=$(git diff --name-only HEAD~1 HEAD -- 'digests/*.md' | tail -n 1)
          if [ -z "$LATEST" ]; then
            LATEST=$(ls -t digests/*.md 2>/dev/null | head -n 1)
          fi
          if [ -z "$LATEST" ] || [ ! -f "$LATEST" ]; then
            echo "Gönderilecek digest yok, çıkılıyor."
            exit 0
          fi
          echo "Gönderiliyor: $LATEST"
          pip install --quiet markdown
          python3 - "$LATEST" <<'PY'
          import os, sys, smtplib, markdown
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          path = sys.argv[1]
          user = os.environ["MAIL_USERNAME"]
          pw   = os.environ["MAIL_APP_PASSWORD"]
          to   = os.environ.get("MAIL_TO") or user

          with open(path, encoding="utf-8") as f:
              md = f.read().strip()
          if not md:
              print("Digest boş, gönderilmiyor."); sys.exit(0)

          html = markdown.markdown(md, extensions=["tables", "fenced_code"])
          html = f"""<div style="font-family:Georgia,serif;max-width:760px;margin:auto;
                     line-height:1.55;color:#1a1a1a">{html}</div>"""

          date = os.path.basename(path).replace("radar-", "").replace(".md", "")
          msg = MIMEMultipart("alternative")
          msg["Subject"] = f"🔭 Quant Radar — {date}"
          msg["From"] = user
          msg["To"] = to
          msg.attach(MIMEText(md, "plain", "utf-8"))
          msg.attach(MIMEText(html, "html", "utf-8"))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pw)
              s.sendmail(user, [to], msg.as_string())
          print("Mail gönderildi:", to)
          PY
