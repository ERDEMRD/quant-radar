name: Mail Quant Radar digest

# ELLE yeniden gönderim aracı. Günlük mail artık radar-scan.yml içinden otomatik gider;
# bu workflow yalnızca Actions sekmesinden "Run workflow" ile tetiklenir — örn. mail
# kaybolduysa ya da formatı test etmek istersen. push tetiklemesi bilinçli olarak
# KALDIRILDI: scan zaten digest push'luyor, ikisi birden çift mail atardı.
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Gönderilecek digest dosyası (boş bırak = en yenisi)"
        required: false
        default: ""

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Digest'i bul ve mail'le
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          DIGEST="${{ github.event.inputs.digest }}"
          if [ -z "$DIGEST" ]; then
            DIGEST=$(ls -t digests/*.md 2>/dev/null | head -n 1)
          fi
          if [ -z "$DIGEST" ] || [ ! -f "$DIGEST" ]; then
            echo "Gönderilecek digest yok, çıkılıyor."
            exit 0
          fi
          pip install --quiet markdown
          echo "Gönderiliyor: $DIGEST"
          python3 scripts/send_digest.py "$DIGEST"
